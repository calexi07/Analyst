name: FX volatility for the chart kit (Bias Engine Phase 2)

on:
  schedule:
    - cron: '50 22 * * 5'  # Friday 22:50 UTC, after the close (GitHub often starts schedules hours late)
    - cron: '20 2 * * 6'   # Saturday 02:20 UTC, second try
    - cron: '0 5 * * 6'    # Saturday 05:00 UTC
    - cron: '0 10 * * 0'   # Sunday 10:00 UTC, retry before Phase 2 (18:55 Bucharest)
  workflow_dispatch:
    inputs:
      asof:
        description: 'Date to compute for (YYYY-MM-DD; the previous Friday is used). Empty = today'
        required: false
        default: ''
  push:
    paths: ['scripts/fx-vol.mjs', '.github/workflows/fx-vol.yml']

permissions:
  contents: write

concurrency: fx-vol

jobs:
  fxvol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Compute weekly sigma and Friday close (Yahoo Finance)
        env:
          ASOF: ${{ github.event.inputs.asof }}
        run: node scripts/fx-vol.mjs
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add exports/fx-vol-*.json
          git diff --cached --quiet && echo "No change" || (git commit -m "FX volatility for the chart kit" && git pull --rebase -q && git push)
