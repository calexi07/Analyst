name: Historical data download (backtests)

# Manual only. Downloads public Dukascopy candles; results are kept as run artifacts (90 days), never committed.
on:
  workflow_dispatch:
    inputs:
      from_year:
        description: First year
        default: '2012'
      timeframes:
        description: Timeframes (comma separated)
        default: 'm15,h1'

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        pair: [eurusd, gbpusd, audusd, usdjpy, euraud, eurjpy, gbpjpy, eurgbp, audnzd, cadjpy]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas
      - run: python scripts/hist-dukas.py ${{ matrix.pair }} ${{ inputs.from_year }} h1
      - uses: actions/upload-artifact@v4
        with:
          name: hist-${{ matrix.pair }}
          path: hist/
          retention-days: 90
