name: Pine indicator data (Bias Engine)

on:
  push:
    branches: [main]
    paths: ['imports/**']
  schedule:
    - cron: '20 5 * * *'    # daily, after the morning check
    - cron: '20 18 * * *'   # daily, after the evening check
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pine
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build pine/bias-engine.pine
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node scripts/pine-gen.mjs
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add pine/
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "Pine indicator data refresh"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && exit 0; sleep 10; done; exit 1
