name: Historical data publish to branch hist-data (backtests)
# Manual only. Takes the hist-* artifacts of a finished "Historical data download" run and commits them to the separate branch hist-data (main is not touched).
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Run id of the download run
        required: true
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: hist-*
          merge-multiple: true
          path: hist
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit to hist-data
        run: |
          ls -la hist; cat hist/*_report.txt | head -40
          cd hist
          git init -q -b hist-data
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Dukascopy BID 15m/1H candles for backtests (run ${{ inputs.run_id }})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" hist-data
