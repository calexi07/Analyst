name: Technical read (Bias Engine)

on:
  schedule:
    - cron: '5 4 * * 1-5'     # before the morning check (06:30 Bucharest)
    - cron: '5 9,13 * * 1-5'  # midday refresh
    - cron: '35 17 * * 0-4'   # before the evening check (19:55 Bucharest)
    - cron: '30 22 * * 0'     # Sunday, after the market opens
  push:
    branches: [main]
    paths: ['imports/**', 'scripts/ta.mjs']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ta
  cancel-in-progress: false

jobs:
  ta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Technical read from Yahoo Finance hourly bars
        run: node scripts/ta.mjs
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add exports/ta-*.json
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "Technical read"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && exit 0; sleep 10; done; exit 1
