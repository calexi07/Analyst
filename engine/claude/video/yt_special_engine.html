<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<style>
@font-face{font-family:Inter;font-weight:500;src:url(node_modules/@fontsource/inter/files/inter-latin-500-normal.woff2)}
@font-face{font-family:Inter;font-weight:600;src:url(node_modules/@fontsource/inter/files/inter-latin-600-normal.woff2)}
@font-face{font-family:Inter;font-weight:700;src:url(node_modules/@fontsource/inter/files/inter-latin-700-normal.woff2)}
@font-face{font-family:SG;font-weight:500;src:url(node_modules/@fontsource/space-grotesk/files/space-grotesk-latin-500-normal.woff2)}
@font-face{font-family:SG;font-weight:700;src:url(node_modules/@fontsource/space-grotesk/files/space-grotesk-latin-700-normal.woff2)}
:root{--bg:#120D0A;--cream:#EADBC4;--sub:#A8998A;--crema:#D9A35B;--bull:#3DDC97;--bear:#F0616D;--blue:#5B8DEF;--card:rgba(234,219,196,.06);--edge:rgba(234,219,196,.15)}
*{box-sizing:border-box}
body{margin:0;width:1920px;height:1080px;background:var(--bg);color:var(--cream);font-family:Inter,sans-serif;overflow:hidden;position:relative}
#bg{position:absolute;inset:0;background:radial-gradient(1400px 900px at 30% 10%,#2C2018,transparent 70%),linear-gradient(180deg,#17110D,#0D0907)}
#glow{position:absolute;width:1400px;height:1400px;border-radius:50%;left:900px;top:-500px;opacity:.10;filter:blur(40px)}
canvas#amb{position:absolute;inset:0}
.sc{position:absolute;inset:0;display:none}.sc.on{display:block}
.card{background:var(--card);border:2px solid var(--edge);border-radius:30px;padding:30px 36px}
.h{font-family:SG;font-weight:700;line-height:1.05}
.num{font-family:SG;font-weight:700;line-height:1}
.lbl{font-size:24px;letter-spacing:3px;font-weight:700;color:var(--sub);text-transform:uppercase}
.abs{position:absolute}
#hud{position:absolute;left:70px;top:48px;display:flex;align-items:center;gap:14px;font-family:SG;font-weight:700;font-size:26px;letter-spacing:3px;z-index:5}
#chapter{position:absolute;right:70px;top:42px;padding:10px 22px;border-radius:14px;background:var(--cream);color:#120D0A;font-family:SG;font-weight:700;font-size:26px;letter-spacing:2px;z-index:5}
#cap{position:absolute;left:220px;right:220px;bottom:58px;text-align:center;font-family:SG;font-weight:700;font-size:46px;line-height:1.15;z-index:6;text-shadow:0 4px 18px rgba(0,0,0,.9)}
#prog{position:absolute;left:0;bottom:0;height:7px;background:var(--crema);z-index:7}
#wipe{position:absolute;inset:-200px;z-index:8;pointer-events:none;display:none}
#sub{position:absolute;right:70px;bottom:150px;display:flex;align-items:center;gap:20px;padding:18px 22px;border-radius:24px;background:var(--cream);color:#120D0A;z-index:9;opacity:0;box-shadow:0 24px 60px rgba(0,0,0,.5)}
#subbtn{padding:14px 28px;border-radius:12px;background:#E5322D;color:#fff;font-family:SG;font-weight:700;font-size:28px;letter-spacing:1px}
#bell{font-size:40px;display:inline-block}
#cursor{position:absolute;width:70px;height:70px;z-index:10;opacity:0}
.coin{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:SG;font-weight:700;color:#120D0A;box-shadow:inset 0 -14px 0 rgba(0,0,0,.18),0 30px 60px rgba(0,0,0,.45)}
.eye{position:absolute;width:26px;height:34px;background:#120D0A;border-radius:50%}
.eye::after{content:'';position:absolute;width:9px;height:9px;background:#fff;border-radius:50%;left:5px;top:6px}
.chip{display:inline-flex;align-items:center;gap:14px;padding:14px 22px;border-radius:18px;background:var(--card);border:2px solid var(--edge);font-family:SG;font-weight:700;font-size:32px}
.bar{position:absolute;top:6px;height:30px;border-radius:10px}
.tag{display:inline-block;padding:6px 12px;border-radius:10px;font-family:SG;font-weight:700;font-size:19px;letter-spacing:.5px;white-space:nowrap}
</style></head><body>
<div id="bg"></div><div id="glow"></div><canvas id="amb" width="1920" height="1080"></canvas>
<div id="stage"></div>
<div id="hud"><svg width="44" height="44" viewBox="230 200 620 700"><g fill="none" stroke="#EADBC4" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"><path d="M330 560 H710 V650 C710 760 640 820 520 820 C400 820 330 760 330 650 Z"/><path d="M280 880 H760"/></g><rect x="418" y="410" width="44" height="80" rx="8" fill="#EADBC4"/><rect x="498" y="350" width="44" height="110" rx="8" fill="#EADBC4"/><rect x="578" y="250" width="44" height="190" rx="8" fill="#3DDC97"/></svg>FX BEFORE COFFEE · YEN UPDATE</div>
<div id="chapter"></div>
<div id="cap"></div><div id="prog"></div><div id="wipe"></div>
<div id="sub"><svg width="64" height="64" viewBox="230 200 620 700"><rect x="230" y="200" width="620" height="700" rx="120" fill="#120D0A"/><g fill="none" stroke="#EADBC4" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"><path d="M330 560 H710 V650 C710 760 640 820 520 820 C400 820 330 760 330 650 Z"/></g><rect x="578" y="250" width="44" height="190" rx="8" fill="#3DDC97"/></svg><div><div style="font-family:SG;font-weight:700;font-size:30px">FX Before Coffee</div><div style="font-size:22px;color:#6B5D50">Weekly outlook + daily updates</div></div><div id="subbtn">SUBSCRIBE</div><span id="bell">🔔</span></div>
<svg id="cursor" viewBox="0 0 24 24"><path d="M5 3l14 8-6 2-2 6z" fill="#fff" stroke="#120D0A" stroke-width="1.4" stroke-linejoin="round"/></svg>
<script>
let SPEC=null,TIM=null,CAPS={},IDS=[];
const cl=x=>Math.min(1,Math.max(0,x)),ease=x=>1-Math.pow(1-cl(x),3),eio=x=>{x=cl(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const back=x=>{x=cl(x);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const sgn=v=>v>0?'+'+v:(v<0?'−'+(-v):'0');const col=v=>v>0?'var(--bull)':(v<0?'var(--bear)':'var(--sub)');
const CV={bear:'var(--bear)',bull:'var(--bull)',crema:'var(--crema)'};
function T(sc,v){v=String(v);if(v[0]!=='@')return +v;const m=v.slice(1).split('+');const k=Math.min(+m[0],TIM[sc].starts.length-1);return TIM[sc].lead+TIM[sc].starts[k]+(m[1]?+m[1]:0)}
function coin(sym,c,size){const fs=sym.length>2?size*0.26:(sym.length>1?size*0.34:size*0.46);return `<div class="coin" data-coin style="width:${size}px;height:${size}px;background:${c};font-size:${fs}px"><div class="eye" style="left:${size*0.3}px;top:${size*0.24}px"></div><div class="eye" style="left:${size*0.58}px;top:${size*0.24}px"></div><span style="margin-top:${size*0.32}px">${sym}</span></div>`}
function S(id,html){return `<section class="sc" id="${id}">${html}</section>`}
function slam(id,n,title){return `<div class="abs" data-chap style="left:0;right:0;top:300px;text-align:center"><div class="lbl" style="font-size:34px;color:${SPEC.colors[id]}">CHAPTER ${n}</div><div class="h" style="font-size:150px;margin-top:10px">${title}</div></div>`}
function status(l){const k=l[0];const c=k==='✅'?'rgba(61,220,151,.18);color:#7FEBBE':k==='🟡'?'rgba(217,163,91,.2);color:#F2C98D':k==='👀'?'rgba(240,97,109,.2);color:#FF9AA2':'rgba(234,219,196,.12);color:#CFC3B2';return `<span class="tag" style="background:${c}">${l}</span>`}
function bias(g){return Math.abs(g)<=2?'TWO-SIDED':(g>0?'BULLISH':'BEARISH')}
function build(){const P=SPEC;let h='';
 h+=S('cold',`<div class="abs" style="left:140px;top:230px;right:140px">${P.cold.map((l,i)=>`<div data-pop="@${i}" class="h" style="font-size:${i==3?56:62}px;margin:30px 0;display:flex;gap:30px;align-items:center;color:${i==3?'var(--crema)':'var(--cream)'}"><span style="font-size:86px">${P.coldIcons[i]}</span><span>${l}</span></div>`).join('')}</div>`);
 h+=S('title',`<div class="abs" style="left:0;right:0;top:230px;text-align:center"><div data-pop="0.2" data-bob style="display:inline-block;position:relative;width:200px;height:200px">${coin('¥','#F0616D',200)}</div><div data-pop="0.5" class="h" style="font-size:150px;letter-spacing:6px;margin-top:30px">YEN UPDATE</div><div data-pop="0.9" style="font-size:44px;color:var(--crema);font-family:SG;font-weight:700;letter-spacing:8px;margin-top:14px">WEEK ${P.week} · MONDAY 16 NOV 2026</div></div>`);
 // recap: coin + gauge + drivers + slot cards
 const bars=(f,attr)=>f.map((v,i)=>`<div style="display:flex;align-items:center;gap:18px;height:50px"><span style="width:290px;font-size:28px;font-weight:600">${P.fn[i]}</span><div style="position:relative;flex:1;height:42px"><div style="position:absolute;left:50%;top:0;bottom:0;width:2px;background:rgba(234,219,196,.25)"></div><div class="bar" ${attr}="${v}" data-fi="${i}" style="background:${col(v)}"></div></div><span class="num" style="width:60px;text-align:right;font-size:34px;color:${col(v)}">${sgn(v)}</span></div>`).join('');
 const rc=Object.entries(P.recapCards).map(([k,v])=>`<div class="card abs" data-slot="${k}" style="left:0;right:0;top:0;display:flex;align-items:center;gap:34px"><div class="num" style="font-size:${v[0].length>6?72:96}px;color:var(--bear);white-space:nowrap">${v[0]}</div><div class="h" style="font-size:38px">${v[1]}</div></div>`).join('');
 h+=S('recap',slam('recap',1,'The weekend view')+`<div data-main>
  <div class="abs" style="left:110px;top:150px;width:560px;text-align:center"><div style="display:inline-block;position:relative;width:260px;height:260px" data-bob>${coin('¥','#F0616D',260)}</div>
   <div class="h" style="font-size:64px;margin-top:20px">Japanese Yen</div>
   <svg width="460" height="250" viewBox="0 0 460 250" style="margin-top:12px"><path d="M40 220 A190 190 0 0 1 420 220" fill="none" stroke="rgba(234,219,196,.15)" stroke-width="26" stroke-linecap="round"/><path d="M40 220 A190 190 0 0 1 230 30" fill="none" stroke="rgba(240,97,109,.55)" stroke-width="26" stroke-linecap="round"/><path d="M230 30 A190 190 0 0 1 420 220" fill="none" stroke="rgba(61,220,151,.55)" stroke-width="26" stroke-linecap="round"/><line data-needle="0" data-from="2" x1="230" y1="220" x2="230" y2="70" stroke="#EADBC4" stroke-width="10" stroke-linecap="round"/><circle cx="230" cy="220" r="18" fill="#EADBC4"/></svg>
   <div class="num" style="font-size:110px;color:var(--sub);margin-top:-30px" data-count="2|0|@1+0.2|1.2|0" data-sign>0</div>
   <div style="font-size:28px;color:var(--sub);margin-top:6px" data-pop="@1+1.4">last week +2 → this week 0 · scale −18 to +18</div></div>
  <div class="abs card" style="left:760px;top:150px;width:1050px;padding:24px 34px" data-pop="@1+0.6"><div class="lbl" style="margin-bottom:8px">The 6 drivers · Week 47 FINAL</div>${bars(P.f,'data-fv')}</div>
  <div class="abs" style="left:760px;top:610px;width:1050px;height:220px">${rc}<div class="card abs" data-slot="6" style="left:0;right:0;top:0;display:flex;align-items:center;gap:34px"><div class="num" style="font-size:96px;color:var(--sub)">0</div><div class="h" style="font-size:38px">Neutral · not weak, not strong · waiting for news</div></div></div></div>`);
 // news
 const nc=Object.entries(P.newsCards).map(([k,v])=>`<div class="card abs" data-slot="${k}" style="left:0;right:0;top:0;height:420px;display:flex;flex-direction:column;justify-content:center;padding:40px 60px"><div class="lbl">${['','GROWTH','INSIDE GDP','THE BANK OF JAPAN','THE DOLLAR SIDE','TOKYO','OIL'][k]}</div><div style="display:flex;align-items:center;gap:56px;margin-top:16px"><div class="num" style="font-size:${v[0].length>6?130:170}px;color:${CV[v[3]]};white-space:nowrap">${v[0]}</div><div><div class="h" style="font-size:60px">${v[1]}</div><div style="font-size:34px;color:var(--sub);margin-top:16px;line-height:1.3">${v[2]}</div></div></div></div>`).join('');
 h+=S('news',slam('news',2,'Overnight news')+`<div data-main><div class="abs h" style="left:140px;top:150px;font-size:80px" data-pop="@1">What happened overnight</div>
  <div class="abs" style="left:140px;top:300px;width:1640px;height:440px">${nc}</div>
  <div class="abs" style="left:140px;top:780px;display:flex;gap:16px" >${['GDP','Inside','BoJ','Fed','Tokyo','Oil'].map((x,i)=>`<span class="chip" data-dot="${i+1}" style="font-size:26px;padding:10px 18px">${x}</span>`).join('')}</div></div>`);
 // meaning
 h+=S('meaning',slam('meaning',3,'What it means')+`<div data-main>
  <div class="abs card" style="left:140px;top:150px;width:1000px;padding:24px 34px" data-pop="@1"><div class="lbl" style="margin-bottom:8px">Shadow drivers · after the GDP miss</div>${bars(P.fsh,'data-sv')}</div>
  <div class="abs card" style="left:1180px;top:150px;width:600px;height:420px;text-align:center" data-pop="@2"><div class="lbl">Raw score</div><div class="num" style="font-size:170px;margin-top:20px;color:var(--bear)" data-count="0|${P.raw}|@2+0.3|1.2|1" data-sign>0</div>
   <div style="position:relative;height:60px;margin:26px 10px 0"><div style="position:absolute;left:0;right:0;top:26px;height:8px;border-radius:4px;background:rgba(234,219,196,.15)"></div>
    <div style="position:absolute;left:25%;top:6px;bottom:6px;border-left:4px dashed var(--crema)"></div><div style="position:absolute;left:75%;top:6px;bottom:6px;border-left:4px dashed var(--crema)"></div><div style="position:absolute;left:50%;top:14px;height:32px;width:2px;background:var(--sub)"></div>
    <div data-mark style="position:absolute;top:14px;width:32px;height:32px;margin-left:-16px;border-radius:50%;background:var(--bear);box-shadow:0 0 24px var(--bear)"></div></div>
   <div style="display:flex;justify-content:space-between;font-size:22px;color:var(--sub);margin:4px 10px 0"><span>−2</span><span style="color:var(--crema)">−1</span><span>0</span><span style="color:var(--crema)">+1</span><span>+2</span></div>
   <div data-pop="@3" style="font-size:28px;font-weight:600;margin-top:14px">Needs a full point → score stays <b>0</b></div></div>
  <div class="abs" data-stamp="@4" style="left:1190px;top:640px;transform:rotate(-8deg);padding:14px 26px;border:7px solid var(--bear);border-radius:20px;color:var(--bear);font-family:SG;font-weight:700;font-size:44px;letter-spacing:3px;white-space:nowrap">WEAKENED · ON WATCH</div>
  <div class="abs" style="left:140px;top:560px;width:1000px;display:grid;grid-template-columns:1fr 1fr;gap:26px" data-pop="@5">
   <div class="card" style="border-color:rgba(240,97,109,.5)"><div class="lbl" style="color:var(--bear)">⬇ Pulling the yen down</div><div class="h" style="font-size:34px;margin-top:12px;line-height:1.35">Stalled economy<br>Low Japanese rates<br>Hawkish Fed</div></div>
   <div class="card" style="border-color:rgba(61,220,151,.5)"><div class="lbl" style="color:var(--bull)">⬆ Holding it up</div><div class="h" style="font-size:34px;margin-top:12px;line-height:1.35">Intervention threat ~160<br>BoJ still set for December</div></div></div>
  <div class="abs card" data-pop="@6" style="left:1180px;top:800px;width:600px;font-size:28px;font-weight:600;border-color:rgba(217,163,91,.4)">💡 Shadow check · published scores unchanged</div></div>`);
 // pairs
 const pc=P.pairs.map((p,i)=>{const k=i<5?i+1:6;return `<div class="card" data-pc="${i}" data-pop="@${k}+${i==6?0.9:0}" style="padding:22px 28px;position:relative"><div style="display:flex;justify-content:space-between;align-items:center"><span class="num" style="font-size:46px">${p[0]}</span><span class="num" style="font-size:66px;color:var(--crema)">${sgn(p[1])}</span></div><div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px"><span style="font-size:24px;font-weight:700;color:${p[1]>=3?'#7FEBBE':(p[1]<=-3?'#FF9AA2':'var(--sub)')}">${bias(p[1])}</span>${status(p[2])}</div><div style="font-size:24px;color:var(--sub);margin-top:12px">If the yen slips to −1 → <b style="color:var(--cream)">${sgn(p[3])}</b> · ${bias(p[3]).toLowerCase()}</div></div>`}).join('');
 h+=S('pairs',slam('pairs',4,'The yen pairs')+`<div data-main><div class="abs h" style="left:140px;top:140px;font-size:76px" data-pop="@1">All seven yen pairs</div><div class="abs" style="left:140px;top:260px;width:1640px;display:grid;grid-template-columns:repeat(3,1fr);gap:22px">${pc}</div></div>`);
 // watch
 h+=S('watch',slam('watch',5,'What to watch')+`<div data-main><div class="abs h" style="left:140px;top:140px;font-size:76px" data-pop="@1">What to watch · times in GMT</div>
  <div class="abs" style="left:140px;top:270px;display:grid;grid-template-columns:repeat(5,316px);gap:20px">${P.days.map(d=>`<div class="card" data-pop="@${d[2]}" style="height:480px;padding:22px"><div class="lbl">${d[0]}</div>${d[1].map(e=>`<div style="margin-top:16px;padding:14px 16px;border-radius:16px;background:rgba(240,97,109,.14)"><div class="h" style="font-size:30px">${e[0]}</div><div style="font-size:22px;color:var(--crema);margin-top:6px">${e[1]}</div><div style="font-size:20px;color:var(--sub);margin-top:4px">${e[2]}</div></div>`).join('')}</div>`).join('')}</div></div>`);
 // scenarios
 h+=S('scen',slam('scen',6,'What could happen')+`<div data-main><div class="abs h" style="left:140px;top:140px;font-size:76px" data-pop="@1">Three paths for the yen</div>
  <div class="abs" style="left:140px;top:270px;width:1640px;display:grid;gap:20px">${P.scen.map((s,i)=>`<div class="card" data-pop="@${i+1}" data-sc="${i+1}" style="display:grid;grid-template-columns:90px 330px 1fr;align-items:center;gap:26px;padding:22px 34px;border-color:${CV[s[4]]}"><span style="font-size:70px">${s[0]}</span><span class="h" style="font-size:48px;color:${CV[s[4]]}">${s[1]}</span><div><div style="font-size:32px;font-weight:600">${s[2]}</div><div style="font-size:28px;color:var(--sub);margin-top:8px">→ ${s[3]}</div></div></div>`).join('')}</div>
  <div class="abs card" data-pop="@4" style="left:140px;top:850px;width:1640px;font-size:32px;font-weight:600;border-color:rgba(217,163,91,.4)">⚖️ Evidence leans slightly to path 1 · Tokyo stands guard · not a trade signal</div></div>`);
 // outro
 h+=S('outro',`<div class="abs" style="left:0;right:0;top:120px;text-align:center"><div data-pop="0.2" style="display:inline-block;position:relative;width:180px;height:180px">${coin('☕','#D9A35B',180)}</div><div data-pop="0.5" class="h" style="font-size:100px;margin-top:22px">FX BEFORE COFFEE</div>
  <div data-pop="@1" class="card" style="display:inline-block;margin-top:30px;text-align:left;padding:22px 34px"><div class="lbl">▶ Full weekly outlook</div><div class="h" style="font-size:40px;margin-top:8px">Fear Is Gone, Dollar Still on Top · Week 47</div></div><br>
  <div data-pop="@2" style="display:inline-flex;align-items:center;gap:24px;margin-top:34px"><div id="obtn" style="padding:24px 66px;border-radius:18px;background:#E5322D;color:#fff;font-family:SG;font-weight:700;font-size:50px;letter-spacing:3px">SUBSCRIBE</div><span id="obell" style="font-size:68px;display:inline-block">🔔</span></div>
  <div data-pop="@2+1" style="font-size:30px;color:var(--sub);margin-top:34px">Fundamental bias only · not a trade signal</div></div>`);
 document.getElementById('stage').innerHTML=h;IDS=SPEC.order}
function draw(sc,t){const E=document.getElementById(sc);
 E.querySelectorAll('[data-pop]').forEach(el=>{const p=back((t-T(sc,el.dataset.pop))/0.55);const a=cl((t-T(sc,el.dataset.pop))/0.3);el.style.opacity=a;el.style.transform=`translateY(${(1-p)*40}px) scale(${0.92+0.08*p})`});
 E.querySelectorAll('[data-stamp]').forEach(el=>{const k=t-T(sc,el.dataset.stamp);const p=back(k/0.4);el.style.opacity=cl(k/0.15);el.style.transform=`rotate(-8deg) scale(${k<0?2:2-1*p})`});
 E.querySelectorAll('[data-count]').forEach(el=>{const [a,b,d,du,dp]=el.dataset.count.split('|');const p=eio((t-T(sc,d))/+du);const v=+a+(+b-+a)*p;let s=(+dp?v.toFixed(+dp):String(Math.round(v)));const n=Number(s);s=n>0?'+'+s:(n<0?'−'+s.replace('-',''):s.replace('-',''));el.textContent=s});
 E.querySelectorAll('[data-fv]').forEach(el=>{const v=+el.dataset.fv,i=+el.dataset.fi;const p=back((t-T(sc,'@1+0.9')-i*0.15)/0.6);const w=Math.max(Math.abs(v)/2*50*p,v===0?0.6:0);el.style.width=w+'%';el.style.left=(v>=0?50:50-w)+'%'});
 E.querySelectorAll('[data-sv]').forEach(el=>{const v=+el.dataset.sv,i=+el.dataset.fi;let p=back((t-T(sc,'@1+0.4')-i*0.1)/0.6);let vv=v;if(i===2){const q=back((t-T(sc,'@1+2.5'))/0.6);vv=v*q;el.style.background=q>0.05?'var(--bear)':'var(--sub)';el.style.boxShadow=q>0.05&&q<1.2?'0 0 22px var(--bear)':'none'}const w=Math.max(Math.abs(vv)/2*50*p,vv===0?0.6:0);el.style.width=w+'%';el.style.left=(vv>=0?50:50-w)+'%';if(i===2)el.parentElement.nextElementSibling.textContent=sgn(Math.round(vv))});
 E.querySelectorAll('[data-mark]').forEach(el=>{const p=eio((t-T(sc,'@2+0.3'))/1.2);el.style.left=(50+(SPEC.raw*p)/2*50)+'%'});
 E.querySelectorAll('[data-needle]').forEach(el=>{const v=+el.dataset.needle,f=+(el.dataset.from||0);const p=back((t-T(sc,'@1+0.2'))/1.2);const ang=(f+(v-f)*p)/18*90;el.setAttribute('transform',`rotate(${ang} 230 220)`)});
 E.querySelectorAll('[data-bob]').forEach(el=>{el.style.transform=`translateY(${Math.sin(t*2.2)*10}px) rotate(${Math.sin(t*1.3)*4}deg)`});
 E.querySelectorAll('.eye').forEach(el=>{const b=(t%3.7)<0.12;el.style.transform=b?'scaleY(0.1)':'scaleY(1)'});
 const ch=E.querySelector('[data-chap]'),mn=E.querySelector('[data-main]');
 if(ch){const out=T(sc,'@1')-0.35;const pin=back(t/0.6),po=eio((t-out)/0.4);ch.style.opacity=cl(t/0.25)*(1-po);ch.style.transform=`scale(${(1.25-0.25*pin)*(1-0.3*po)})`;mn.style.opacity=cl((t-out)/0.4);
  const slots=[...E.querySelectorAll('[data-slot]')];let cur=null;slots.forEach(s=>{if(t>=T(sc,'@'+s.dataset.slot))cur=s});
  slots.forEach(s=>{const st=T(sc,'@'+s.dataset.slot);const on=s===cur;const k=t-st;const p=back(k/0.5);s.style.opacity=on?cl(k/0.25):0;s.style.transform=`translateX(${on?(1-p)*80:0}px)`});
  E.querySelectorAll('[data-dot]').forEach(d=>{const on=cur&&cur.dataset.slot===d.dataset.dot;d.style.background=on?'var(--cream)':'var(--card)';d.style.color=on?'#120D0A':'var(--cream)';d.style.opacity=t>=T(sc,'@1')?1:0});
  // pairs: highlight the active one
  E.querySelectorAll('[data-pc]').forEach(c=>{const i=+c.dataset.pc;const k=i<5?i+1:6;const a=i<5?(k+1):99;const on=t>=T(sc,'@'+k)&&(i>=5?true:t<T(sc,'@'+a));c.style.borderColor=on?'var(--crema)':'var(--edge)';c.style.background=on?'rgba(217,163,91,.10)':'var(--card)'});
  E.querySelectorAll('[data-sc]').forEach(c=>{const i=+c.dataset.sc;const on=t>=T(sc,'@'+i)&&t<T(sc,'@'+(i+1));c.style.boxShadow=on?'0 0 0 4px rgba(234,219,196,.25)':'none'})}
 if(sc==='outro'){const tap=T('outro','@2')+1.8,k=t-tap;const b=document.getElementById('obtn');const on=k>0;b.style.background=on?'#3A2E26':'#E5322D';b.textContent=on?'SUBSCRIBED ✓':'SUBSCRIBE';b.style.transform=(k>0&&k<0.18)?'scale(.94)':'scale(1)';document.getElementById('obell').style.transform=`rotate(${k>0.6&&k<2?Math.sin(k*30)*18*(2-k):0}deg)`;
  const cu=document.getElementById('cursor');const r=b.getBoundingClientRect();const ca=eio((t-(tap-0.9))/0.8);cu.style.opacity=(t>tap-0.9&&t<tap+1.2)?1:0;cu.style.left=(1700-(1700-r.left-r.width*0.5)*ca)+'px';cu.style.top=(1040-(1040-r.top-r.height*0.4)*ca)+'px'}
}
function drawAmb(g){const c=document.getElementById('amb').getContext('2d');c.clearRect(0,0,1920,1080);c.lineWidth=2;for(let k=0;k<3;k++){c.strokeStyle=`rgba(234,219,196,${0.04+k*0.015})`;c.beginPath();for(let x=0;x<=1920;x+=14){const y=880+k*60+30*Math.sin(x/170+g*0.35+k)+18*Math.sin(x/70-g*0.6+k*2);x?c.lineTo(x,y):c.moveTo(x,y)}c.stroke()}}
function caption(sc,t){const el=document.getElementById('cap');const W=CAPS[sc]||[];const tt=t-TIM[sc].lead;const ch=[];let cur=[];W.forEach((w,i)=>{cur.push(w);if(cur.length===6||/[.,?!:]$/.test(w[0])&&cur.length>2||i===W.length-1){ch.push(cur);cur=[]}});
 const c=ch.find(g=>tt>=g[0][1]-0.05&&tt<=g[g.length-1][2]+0.2);if(!c){el.innerHTML='';return}
 el.innerHTML=c.map(w=>{const on=tt>=w[1]-0.03&&tt<w[2]+0.03;return `<span style="display:inline-block;margin:0 .13em;color:${on?'#D9A35B':'#EADBC4'}">${w[0]}</span>`}).join('')}
window.init=(spec,tim,caps)=>{SPEC=spec;TIM=tim;CAPS=caps;build()};
window.cueList=si=>{const sc=IDS[si];const E=document.getElementById(sc);const out=[];if(si>0)out.push({t:0,type:'whoosh'});
 E.querySelectorAll('[data-pop]').forEach(el=>out.push({t:T(sc,el.dataset.pop),type:'pop'}));
 E.querySelectorAll('[data-stamp]').forEach(el=>out.push({t:T(sc,el.dataset.stamp),type:'hit'}));
 if(E.querySelector('[data-chap]'))out.push({t:0.05,type:'hit'},{t:T(sc,'@1')+0.9,type:'swish'});
 E.querySelectorAll('[data-slot]').forEach(s=>out.push({t:T(sc,'@'+s.dataset.slot),type:'swish'}));
 if(sc==='meaning')out.push({t:T(sc,'@1+2.5'),type:'thud'});
 if(sc==='outro')out.push({t:T('outro','@2')+1.8,type:'click'},{t:T('outro','@2')+1.85,type:'ding'});
 SPEC.subs.filter(s=>s[0]===sc&&sc!=='outro').forEach(s=>out.push({t:s[1],type:'pop'},{t:s[1]+2.2,type:'click'},{t:s[1]+2.25,type:'ding'}));
 if(sc==='cold')out.push({t:0.1,type:'swell'});
 return out.filter(o=>o.t<TIM[sc].dur)};
window.render=(si,t,gt,total)=>{const sc=IDS[si];IDS.forEach(id=>document.getElementById(id).classList.remove('on'));const E=document.getElementById(sc);E.classList.add('on');draw(sc,t);
 const W=document.getElementById('wipe');const TR=0.7;
 if(si>0&&t<TR){const p=eio(t/TR);W.style.display='block';W.style.background=SPEC.colors[sc]||'#D9A35B';W.style.transform=`translateX(${(-1+2*p)*130}%) skewX(-14deg)`}else W.style.display='none';
 if(si>0&&t<TR*0.5){const P=document.getElementById(IDS[si-1]);P.classList.add('on');draw(IDS[si-1],TIM[IDS[si-1]].dur);E.classList.remove('on')}
 document.getElementById('glow').style.background=SPEC.colors[sc]||'#D9A35B';
 const chp=document.getElementById('chapter');chp.textContent=SPEC.chips[sc]||'';chp.style.opacity=SPEC.chips[sc]?1:0;
 document.getElementById('hud').style.opacity=(sc==='title'||sc==='outro')?0:1;
 const s=SPEC.subs.find(x=>x[0]===sc&&sc!=='outro'&&t>=x[1]-0.01&&t<=x[1]+4.6);const se=document.getElementById('sub'),sb=document.getElementById('subbtn'),cu=document.getElementById('cursor');
 if(s){const k=t-s[1];const pin=back(k/0.5),pout=eio((k-4.0)/0.5);se.style.opacity=cl(k/0.2)*(1-pout);se.style.transform=`translateX(${(1-pin)*120}px)`;const tap=k>=2.2;sb.style.background=tap?'#3A2E26':'#E5322D';sb.textContent=tap?'SUBSCRIBED ✓':'SUBSCRIBE';sb.style.transform=(tap&&k<2.4)?'scale(.92)':'scale(1)';document.getElementById('bell').style.transform=`rotate(${k>2.6&&k<3.8?Math.sin(k*30)*20:0}deg)`;
  const ca=eio((k-1.4)/0.7);cu.style.opacity=(k>1.4&&k<3.6)?1:0;const r=sb.getBoundingClientRect();cu.style.left=(1960-(1960-r.left-r.width*0.45)*ca)+'px';cu.style.top=(1120-(1120-r.top-r.height*0.4)*ca)+'px'}
 else{se.style.opacity=0;if(sc!=='outro')cu.style.opacity=0}
 drawAmb(gt);caption(sc,t);document.getElementById('prog').style.width=(gt/total*100)+'%'};
</script></body></html>
