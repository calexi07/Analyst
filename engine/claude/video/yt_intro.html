<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:SG;font-weight:500;src:url(../../node_modules/@fontsource/space-grotesk/files/space-grotesk-latin-500-normal.woff2)}
@font-face{font-family:SG;font-weight:700;src:url(../../node_modules/@fontsource/space-grotesk/files/space-grotesk-latin-700-normal.woff2)}
@font-face{font-family:Inter;font-weight:600;src:url(../../node_modules/@fontsource/inter/files/inter-latin-600-normal.woff2)}
body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#0B0806;color:#EADBC4;position:relative}
#bg{position:absolute;inset:0;background:radial-gradient(1100px 700px at 50% 45%,#2A1E16,transparent 70%)}
canvas{position:absolute;inset:0}
#logo{position:absolute;left:760px;top:170px;width:400px;height:452px}
#name{position:absolute;left:0;right:0;top:640px;text-align:center;font-family:SG;font-weight:700;font-size:118px;letter-spacing:10px;white-space:nowrap}
#name span{display:inline-block}
#tag{position:absolute;left:0;right:0;top:800px;text-align:center;font-family:Inter;font-weight:600;font-size:34px;letter-spacing:8px;color:#D9A35B}
#sweep{position:absolute;top:0;bottom:0;width:260px;background:linear-gradient(90deg,transparent,rgba(255,240,215,.16),transparent);transform:skewX(-18deg)}
#fade{position:absolute;inset:0;background:#0B0806}
</style></head><body>
<div id="bg"></div><canvas id="cv" width="1920" height="1080"></canvas>
<svg id="logo" viewBox="230 200 620 700">
 <g fill="none" stroke="#EADBC4" stroke-width="30" stroke-linecap="round" stroke-linejoin="round">
  <path id="cup" d="M330 560 H710 V650 C710 760 640 820 520 820 C400 820 330 760 330 650 Z"/>
  <path id="handle" d="M710 600 H750 C800 600 820 640 805 680 C790 720 750 730 710 720"/>
  <path id="base" d="M280 880 H760"/></g>
 <g stroke-linecap="round"><line id="w1" x1="440" y1="380" x2="440" y2="510" stroke="#EADBC4" stroke-width="12"/><rect id="c1" x="418" y="410" width="44" height="70" rx="8" fill="#EADBC4"/>
 <line id="w2" x1="520" y1="330" x2="520" y2="490" stroke="#EADBC4" stroke-width="12"/><rect id="c2" x="498" y="360" width="44" height="95" rx="8" fill="#EADBC4"/>
 <line id="w3" x1="600" y1="230" x2="600" y2="470" stroke="#3DDC97" stroke-width="12"/><rect id="c3" x="578" y="270" width="44" height="160" rx="8" fill="#3DDC97"/></g>
</svg>
<div id="name"></div><div id="tag">WEEKLY FOREX OUTLOOK · FUNDAMENTALS, MADE CLEAR</div>
<div id="sweep"></div><div id="fade"></div>
<script>
const cl=x=>Math.min(1,Math.max(0,x)),ease=x=>1-Math.pow(1-cl(x),3),eio=x=>{x=cl(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2},back=x=>{x=cl(x);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const N='FX BEFORE COFFEE';document.getElementById('name').innerHTML=[...N].map(c=>`<span>${c===' '?'&nbsp;':c}</span>`).join('');
const L=['cup','handle','base'].map(id=>{const e=document.getElementById(id);const l=e.getTotalLength();e.style.strokeDasharray=l;return [e,l]});
const CODES='USD  EUR  GBP  JPY  CHF  CAD  AUD  NZD  XAU  ';
window.DUR=7.2;
window.render=t=>{const c=document.getElementById('cv').getContext('2d');c.clearRect(0,0,1920,1080);
 // ticker rows
 c.font='700 46px SG';for(let r=0;r<6;r++){const y=120+r*170;c.fillStyle=`rgba(234,219,196,${0.035*cl((t-0.3)/1)})`;const sp=(r%2?1:-1)*(60+r*12);const txt=CODES.repeat(6);const w=c.measureText(CODES).width;let x=((t*sp)%w)-w;c.fillText(txt,x,y)}
 // chart line drawing across (0-1.3)
 const p=eio(t/1.3);c.strokeStyle='rgba(217,163,91,.85)';c.lineWidth=4;c.beginPath();const N2=120;for(let i=0;i<=N2*p;i++){const x=i/N2*1920;const y=560+60*Math.sin(i/9)*Math.exp(-i/80)-i*1.1;i?c.lineTo(x,y):c.moveTo(x,y)}c.globalAlpha=1-cl((t-1.4)/0.6);c.stroke();c.globalAlpha=1;
 // steam
 for(let k=0;k<3;k++){c.strokeStyle=`rgba(234,219,196,${0.10*cl((t-2.2)/0.8)})`;c.lineWidth=5;c.beginPath();for(let y=0;y<170;y+=6){const x=930+k*40+12*Math.sin(y/22+t*3+k);y?c.lineTo(x,180-y+Math.sin(t)*4):c.moveTo(x,180)}c.stroke()}
 // logo: candles grow (0.6-1.6), cup draws (1.3-2.4)
 [['c1','w1',0.6],['c2','w2',0.8],['c3','w3',1.0]].forEach(([r,w,d])=>{const s=back((t-d)/0.5);const R=document.getElementById(r),W=document.getElementById(w);R.style.transformOrigin='center bottom';R.style.transformBox='fill-box';R.style.transform=`scaleY(${s})`;W.style.opacity=cl((t-d)/0.3)});
 L.forEach(([e,l],i)=>{e.style.strokeDashoffset=l*(1-eio((t-1.3-i*0.2)/0.9))});
 const lg=document.getElementById('logo');const z=t<5.9?1+0.02*t/5.9:1+0.02+0.25*eio((t-5.9)/1.1);lg.style.transform=`scale(${z}) translateY(${-6*Math.sin(t*1.2)}px)`;
 // name letters
 [...document.querySelectorAll('#name span')].forEach((s,i)=>{const k=back((t-2.3-i*0.045)/0.5);s.style.opacity=cl((t-2.3-i*0.045)/0.25);s.style.transform=`translateY(${(1-k)*60}px)`});
 const tg=document.getElementById('tag');tg.style.opacity=cl((t-3.4)/0.6);tg.style.letterSpacing=(16-8*ease((t-3.4)/1.2))+'px';
 const sw=document.getElementById('sweep');sw.style.left=(-400+2600*eio((t-4.2)/1.2))+'px';
 const f=document.getElementById('fade');f.style.opacity=t<0.4?1-t/0.4:cl((t-6.6)/0.6)};
</script></body></html>
